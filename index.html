<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIXIT AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1115;
    color: white;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 20px;
}

header {
    text-align: center;
    padding: 50px 10px 30px;
}

.logo {
    font-size: 46px;
    font-weight: bold;
}

.logo span {
    color: #4ade80;
}

.subtitle {
    color: #a7adb8;
    font-size: 18px;
    line-height: 1.5;
    margin-top: 15px;
}

.card {
    background: #191c23;
    border: 1px solid #292e38;
    border-radius: 20px;
    padding: 25px;
    margin-top: 20px;
}

h2 {
    margin-top: 0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 17px;
    font-size: 16px;
    color: white;
    background: #252a33;
    cursor: pointer;
}

button:hover {
    background: #343a46;
}

.answer {
    display: block;
    width: 100%;
    margin-top: 12px;
    text-align: left;
}

.green {
    background: #4ade80;
    color: #07130b;
    font-weight: bold;
    width: 100%;
    margin-top: 15px;
}

.hidden {
    display: none;
}

.question {
    font-size: 21px;
    font-weight: bold;
    line-height: 1.4;
}

.progress {
    color: #858d9a;
    margin-bottom: 15px;
}

.success {
    border-color: #4ade80;
}

.success h2 {
    color: #4ade80;
}

.small {
    color: #a7adb8;
    line-height: 1.6;
}

@media(max-width:600px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .logo {
        font-size: 38px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">FIXIT<span>AI</span></div>

    <div class="subtitle">
        Dein persönlicher Techniker.
        <br>
        Wir finden heraus, was los ist – Schritt für Schritt.
    </div>
</header>


<!-- START -->

<div class="card" id="start">

    <h2>🔧 Was funktioniert nicht?</h2>

    <div class="grid">

        <button onclick="startDiagnosis('WLAN')">
            📡 WLAN / Internet
        </button>

        <button onclick="startDiagnosis('TV')">
            📺 Fernseher
        </button>

        <button onclick="startDiagnosis('Konsole')">
            🎮 Xbox / PlayStation
        </button>

        <button onclick="startDiagnosis('Drucker')">
            🖨️ Drucker
        </button>

        <button onclick="startDiagnosis('Computer')">
            💻 Computer
        </button>

        <button onclick="startDiagnosis('Smartphone')">
            📱 Smartphone
        </button>

        <button onclick="startDiagnosis('Kopfhörer')">
            🎧 Kopfhörer
        </button>

        <button onclick="startDiagnosis('Andere')">
            ❓ Anderes Gerät
        </button>

    </div>

</div>


<!-- DIAGNOSE -->

<div class="card hidden" id="diagnosis">

    <div class="progress" id="progress"></div>

    <div class="question" id="question"></div>

    <div id="answers"></div>

</div>


<!-- ERFOLG -->

<div class="card success hidden" id="success">

    <h2>🎉 Problem gelöst!</h2>

    <p class="small">
        Perfekt! Genau so soll FIXIT AI funktionieren:
        Schritt für Schritt zur Lösung, ohne dich mit
        unnötigen Informationen zu überladen.
    </p>

    <button onclick="restart()">
        🔄 Neues Problem
    </button>

</div>


</div>


<script>

let device = "";
let step = 0;


/* START */

function startDiagnosis(selectedDevice) {

    device = selectedDevice;
    step = 0;

    document.getElementById("start")
        .classList.add("hidden");

    document.getElementById("diagnosis")
        .classList.remove("hidden");

    document.getElementById("success")
        .classList.add("hidden");

    showStep();
}


/* DIAGNOSE */

function showStep() {

    const question =
        document.getElementById("question");

    const answers =
        document.getElementById("answers");

    const progress =
        document.getElementById("progress");


    if (device === "WLAN") {

        showWifiStep(
            question,
            answers,
            progress
        );

        return;
    }


    progress.innerText =
        "Erste Analyse";

    question.innerText =
        "Was genau funktioniert bei deinem " +
        device +
        " nicht?";

    answers.innerHTML = `

        <button class="answer"
            onclick="genericAnswer()">
            🔧 Ich beschreibe mein Problem
        </button>

        <button class="answer"
            onclick="restart()">
            🔄 Anderes Gerät auswählen
        </button>

    `;
}


/* WLAN */

function showWifiStep(question, answers, progress) {

    progress.innerText =
        "Schritt " + (step + 1) + " von 4";


    if (step === 0) {

        question.innerText =
            "Funktioniert das Internet auf anderen Geräten ebenfalls nicht?";

        answers.innerHTML = `

            <button class="answer"
                onclick="wifiAnswer('all')">
                🔴 Ja – mehrere Geräte haben kein Internet
            </button>

            <button class="answer"
                onclick="wifiAnswer('one')">
                🟢 Nein – nur dieses Gerät hat Probleme
            </button>

        `;

    }


    else if (step === 1) {

        question.innerText =
            "Siehst du an deinem Router eine rote oder ungewöhnlich blinkende Leuchte?";

        answers.innerHTML = `

            <button class="answer"
                onclick="wifiAnswer('red')">
                🔴 Ja
            </button>

            <button class="answer"
                onclick="wifiAnswer('normal')">
                🟢 Nein, alles sieht normal aus
            </button>

        `;

    }


    else if (step === 2) {

        question.innerText =
            "Öffne auf deinem Smartphone eine Webseite. Wird sie geladen?";

        answers.innerHTML = `

            <button class="answer"
                onclick="wifiAnswer('yes')">
                🟢 Ja
            </button>

            <button class="answer"
                onclick="wifiAnswer('no')">
                🔴 Nein
            </button>

        `;

    }


    else {

        question.innerText =
            "Starte jetzt deinen Router neu.";

        answers.innerHTML = `

            <p class="small">
                Ziehe den Netzstecker des Routers.
                Warte ungefähr 30 Sekunden und stecke
                ihn anschließend wieder ein.
            </p>

            <button class="green"
                onclick="wifiRestarted()">
                🔄 Router wurde neu gestartet
            </button>

        `;
    }
}


/* WLAN ANTWORT */

function wifiAnswer(answer) {

    if (answer === "one") {

        questionMessage(
            "Das Problem scheint nur dieses Gerät zu betreffen.",
            "Als Nächstes würden wir genau dieses Gerät untersuchen."
        );

        return;
    }


    if (answer === "red") {

        questionMessage(
            "Eine ungewöhnliche Router-Anzeige wurde erkannt.",
            "Im nächsten Schritt würden wir das genaue Routermodell und die Anzeige prüfen."
        );

        return;
    }


    if (answer === "yes") {

        questionMessage(
            "Deine Internetverbindung funktioniert grundsätzlich.",
            "Das Problem könnte auf das betroffene Gerät beschränkt sein."
        );

        return;
    }


    if (answer === "all" ||
        answer === "normal" ||
        answer === "no") {

        step++;

        showStep();
    }
}


/* NEUSTART */

function wifiRestarted() {

    document.getElementById("diagnosis")
        .classList.add("hidden");

    document.getElementById("success")
        .classList.remove("hidden");
}


/* GENERISCHE GERÄTE */

function genericAnswer() {

    const question =
        document.getElementById("question");

    const answers =
        document.getElementById("answers");

    question.innerText =
        "🤖 KI-Diagnose kommt als Nächstes";

    answers.innerHTML = `

        <p class="small">
            In der nächsten Version analysiert FIXIT AI
            dein konkretes Problem automatisch und erstellt
            einen individuellen Lösungsweg.
        </p>

        <button class="green"
            onclick="restart()">
            🔄 Neues Problem
        </button>

    `;
}


/* ZWISCHENMELDUNG */

function questionMessage(title, text) {

    const question =
        document.getElementById("question");

    const answers =
        document.getElementById("answers");

    question.innerText = title;

    answers.innerHTML = `

        <p class="small">
            ${text}
        </p>

        <button class="green"
            onclick="restart()">
            🔄 Neues Problem
        </button>

    `;
}


/* NEUSTART */

function restart() {

    device = "";
    step = 0;

    document.getElementById("start")
        .classList.remove("hidden");

    document.getElementById("diagnosis")
        .classList.add("hidden");

    document.getElementById("success")
        .classList.add("hidden");
}

</script>

</body>
</html>
