<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIXIT AI – Dein persönlicher Techniker</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0f1115;
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 20px;
}

header {
    text-align: center;
    padding: 55px 15px 35px;
}

.logo {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: -2px;
}

.logo span {
    color: #4ade80;
}

.subtitle {
    color: #a7adb8;
    margin-top: 14px;
    font-size: 18px;
    line-height: 1.5;
}

.card {
    background: #191c23;
    border: 1px solid #292e38;
    border-radius: 22px;
    padding: 30px;
    margin-top: 20px;
}

h2 {
    font-size: 25px;
    margin-bottom: 22px;
}

.device-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

button {
    border: none;
    border-radius: 13px;
    padding: 17px;
    font-size: 16px;
    cursor: pointer;
    background: #252a33;
    color: white;
    transition: 0.2s;
}

button:hover {
    background: #343a46;
    transform: translateY(-2px);
}

.green-button {
    background: #4ade80;
    color: #07130b;
    font-weight: bold;
    width: 100%;
    margin-top: 18px;
}

.green-button:hover {
    background: #65e891;
}

.hidden {
    display: none;
}

.progress {
    color: #7f8794;
    font-size: 14px;
    margin-bottom: 12px;
}

.question {
    font-size: 22px;
    font-weight: bold;
    line-height: 1.4;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    text-align: left;
    background: #252a33;
}

.answer:hover {
    background: #343a46;
}

.success {
    background: #102018;
    border: 1px solid #2f7548;
}

.success h2 {
    color: #4ade80;
}

.warning {
    background: #201a10;
    border: 1px solid #705323;
}

.small {
    color: #a7adb8;
    line-height: 1.6;
    margin-top: 10px;
}

.restart {
    margin-top: 20px;
    width: 100%;
}

footer {
    text-align: center;
    color: #686f7c;
    padding: 40px 20px;
    font-size: 13px;
}

@media (max-width: 600px) {

    .logo {
        font-size: 37px;
    }

    .device-grid {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 22px;
    }

}

</style>
</head>

<body>

<div class="container">

<header>

    <div class="logo">
        FIXIT<span>AI</span>
    </div>

    <div class="subtitle">
        Dein persönlicher Techniker.
        <br>
        Wir finden heraus, was los ist – Schritt für Schritt.
    </div>

</header>


<!-- START -->

<div class="card" id="start">

    <h2>🔧 Was funktioniert nicht?</h2>

    <div class="device-grid">

        <button onclick="startDiagnosis('WLAN / Internet')">
            📡
